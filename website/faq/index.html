<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frequently Asked Questions — Tane Residence</title>
<meta name="description" content="Answers to common questions about renting with Tane Residence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500;600&family=Raleway:wght@500;600;700&display=swap">
<style>
  /* Palette and type lifted from taneresidence.com (WordPress/Divi custom CSS), so this page
     reads as part of the same site rather than as a lookalike. The site commits to a single
     light theme with a black masthead; this page does the same, deliberately, which is why
     there is no prefers-color-scheme block. */
  :root{
    --black:#000000;
    --ink:#1a1a1a;          /* site hero heading colour */
    --body:#54595e;         /* a shade darker than the site's #666, for long-form answers */
    --muted:rgba(30,30,30,0.55);
    --green:#099679;        /* masthead rule, buttons */
    --green-deep:#247568;   /* eyebrow + label green */
    --green-mid:#0c8b78;    /* secondary accent */
    --line:rgba(45,144,127,0.22);
    --line-soft:#e8ebe9;
    --panel:#f5f5f5;
    --bg:#ffffff;
    --display:"Cormorant Garamond",Georgia,'Times New Roman',serif;
    --ui:"Raleway",Helvetica,Arial,sans-serif;
    --text:"DM Sans",Helvetica,Arial,sans-serif;
    --pill:100px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--body);
    font-family:var(--text);font-size:16px;line-height:1.7;font-weight:400;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    display:flex;flex-direction:column;min-height:100vh;
  }

  /* ---- masthead: black bar, 1px green rule, exactly as the main site ---- */
  .masthead{background:var(--black);border-bottom:1px solid var(--green)}
  .masthead-in{
    max-width:1180px;margin:0 auto;padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .brand{display:inline-flex;align-items:center;line-height:0}
  .brand img{height:38px;width:auto;display:block}
  .brand:focus-visible{outline:2px solid var(--green);outline-offset:6px}
  .masthead-nav{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .masthead-nav a{
    font-family:var(--ui);font-size:13px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;color:#fff;text-decoration:none;transition:color .18s;
  }
  .masthead-nav a:hover,.masthead-nav a:focus-visible{color:var(--green)}
  .masthead-nav a:focus-visible{outline:2px solid var(--green);outline-offset:4px}

  /* ---- hero ---- */
  .hero{padding:72px 24px 8px;text-align:center}
  .eyebrow{
    font-family:var(--text);font-size:13px;font-weight:600;letter-spacing:3px;
    text-transform:uppercase;color:var(--green-deep);
    border:1px solid var(--line);border-radius:var(--pill);
    padding:9px 26px;display:inline-block;margin:0 0 26px;
  }
  .hero h1{
    font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,6vw,4.25rem);
    line-height:1.1;color:var(--ink);margin:0 0 18px;text-wrap:balance;
  }
  .hero h1 strong{font-weight:600}
  .hero-sub{
    font-family:var(--text);font-size:16px;color:var(--muted);
    max-width:46ch;margin:0 auto;text-wrap:balance;
  }
  .hero-sub a{color:var(--green-deep);text-decoration:none;border-bottom:1px solid var(--line)}
  .hero-sub a:hover{color:var(--green);border-bottom-color:var(--green)}

  /* ---- body ---- */
  main{flex:1 0 auto}
  .wrap{max-width:820px;margin:0 auto;padding:44px 24px 88px}

  /* building picker, styled as one of the site's glass pills */
  .picker{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;
    margin:0 0 48px;padding:14px 26px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--pill);width:fit-content;
    margin-left:auto;margin-right:auto;
  }
  .picker label{
    font-family:var(--text);font-size:12px;font-weight:600;letter-spacing:2px;
    text-transform:uppercase;color:var(--muted);
  }
  select{
    font-family:var(--ui);font-size:15px;font-weight:600;color:var(--green-deep);
    padding:6px 30px 6px 12px;border:1px solid var(--line);border-radius:var(--pill);
    background-color:#fff;cursor:pointer;appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23247568' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 12px center;
  }
  select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .building-search{position:relative;min-width:min(360px,100%);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .building-search input{
    font-family:var(--ui);font-size:15px;font-weight:600;color:var(--green-deep);
    padding:9px 14px;border:1px solid var(--line);border-radius:var(--pill);
    background:#fff;min-width:min(300px,100%);
  }
  .building-search input:focus-visible,
  .building-clear:focus-visible,
  .match-row:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .building-clear{
    font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;color:var(--green-deep);background:#fff;
    border:1px solid var(--line);border-radius:var(--pill);padding:9px 14px;cursor:pointer;
  }
  .building-clear:hover{color:var(--green)}
  .matches{
    position:absolute;z-index:5;left:0;right:0;top:calc(100% + 8px);
    border:1px solid var(--line);border-radius:8px;background:#fff;
    box-shadow:0 14px 30px rgba(0,0,0,0.08);overflow:hidden;
  }
  .match-row{
    display:block;width:100%;text-align:left;background:#fff;border:0;cursor:pointer;
    padding:10px 14px;border-bottom:1px solid var(--line-soft);
  }
  .match-row:last-child{border-bottom:0}
  .match-row:hover,.match-row[aria-selected="true"]{background:var(--panel)}
  .match-label{display:block;font-family:var(--ui);font-size:14px;font-weight:500;color:var(--ink);line-height:1.35}
  .match-building{display:block;margin-top:2px;font-family:var(--text);font-size:13px;color:var(--muted);line-height:1.35}

  /* category eyebrow + hairline rule */
  .cat{
    display:flex;align-items:center;gap:18px;
    margin:52px 0 18px;
  }
  .cat:first-child{margin-top:0}
  .cat h2{
    font-family:var(--text);font-size:12px;font-weight:600;letter-spacing:3px;
    text-transform:uppercase;color:var(--green-deep);margin:0;white-space:nowrap;
  }
  .cat span{flex:1;height:1px;background:var(--line-soft)}

  /* accordions */
  details{
    border:1px solid var(--line-soft);border-radius:8px;margin-bottom:10px;
    background:#fff;overflow:hidden;transition:border-color .18s;
  }
  details:hover{border-color:var(--line)}
  details[open]{border-color:var(--line)}
  summary{
    font-family:var(--ui);font-size:16px;font-weight:600;color:var(--ink);
    cursor:pointer;padding:18px 56px 18px 22px;list-style:none;position:relative;
    transition:color .18s;
  }
  summary::-webkit-details-marker{display:none}
  summary:hover{color:var(--green-deep)}
  details[open] summary{color:var(--green-deep)}
  summary::after{
    content:'';position:absolute;right:24px;top:50%;width:8px;height:8px;
    border-right:2px solid var(--green);border-bottom:2px solid var(--green);
    transform:translateY(-70%) rotate(45deg);transition:transform .2s ease;
  }
  details[open] summary::after{transform:translateY(-30%) rotate(225deg)}
  summary:focus-visible{outline:2px solid var(--green);outline-offset:-2px;border-radius:8px}
  .answer{
    padding:0 22px 22px;color:var(--body);font-size:15.5px;line-height:1.75;
  }
  .faq-images{
    display:grid;gap:14px;margin-top:18px;
  }
  .faq-images figure{
    margin:0;
  }
  .faq-images img{
    display:block;max-width:100%;height:auto;border-radius:8px;
  }
  .faq-images figcaption{
    margin-top:7px;color:var(--muted);font-size:13.5px;line-height:1.5;
  }

  .note,.err{font-family:var(--text);color:var(--muted);text-align:center}
  .err{
    border:1px solid var(--line-soft);border-radius:8px;padding:28px;
    background:var(--panel);
  }

  /* ---- footer ---- */
  .foot{background:var(--black);border-top:1px solid var(--green);color:rgba(255,255,255,0.62)}
  .foot-in{
    max-width:1180px;margin:0 auto;padding:34px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    font-family:var(--text);font-size:13px;letter-spacing:.4px;
  }
  .foot a{color:#fff;text-decoration:none;border-bottom:1px solid var(--green)}
  .foot a:hover{color:var(--green)}

  @media (max-width:780px){
    .masthead-in{padding:14px 18px;gap:14px}
    .brand img{height:32px}
    .masthead-nav{gap:18px}
    .masthead-nav a{font-size:11px;letter-spacing:1.2px}
    .hero{padding:48px 20px 4px}
    .eyebrow{font-size:11px;letter-spacing:2px;padding:8px 18px;margin-bottom:20px}
    .wrap{padding:32px 18px 64px}
    .picker{border-radius:16px;padding:14px 18px;gap:10px}
    .building-search,.building-search input{width:100%}
    .building-clear{width:100%}
    summary{font-size:15px;padding:16px 48px 16px 18px}
    .answer{padding:0 18px 18px}
    .foot-in{justify-content:center;text-align:center}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(function () {
  // Same-origin: nginx on this host proxies /api/website/ through to Tenafy. Keeping it relative
  // means the browser never makes a cross-site request, so there is no CORS grant to maintain and
  // nothing breaks the day a domain changes.
  var API = '/api/website/taneres/faqs';

  var LABELS = {
    payments: 'Payments', moving_in: 'Moving in', moving_out: 'Moving out',
    maintenance: 'Maintenance', building_access: 'Building access',
    lease_renewal: 'Leases & renewals', other: 'General'
  };
  // Headings appear in this order; anything unrecognised falls to the end.
  var ORDER = ['payments','moving_in','moving_out','maintenance','building_access','lease_renewal','other'];

  var out = document.getElementById('out');
  var picker = document.getElementById('picker');
  var input = document.getElementById('buildingSearch');
  var clear = document.getElementById('clearBuilding');
  var matchesBox = document.getElementById('buildingMatches');
  var propertyGroups = [];
  var chosenKey = null;
  var activeMatch = -1;

  // Everything from the API is treated as text, never markup. An answer is written by staff in
  // a CMS; if it ever contained a tag, this is what stops it running in a visitor's browser.
  function el(tag, text) {
    var n = document.createElement(tag);
    if (text != null) n.textContent = String(text);
    return n;
  }

  function categoryHeading(key) {
    var row = document.createElement('div');
    row.className = 'cat';
    row.appendChild(el('h2', LABELS[key] || 'General'));
    row.appendChild(document.createElement('span'));
    return row;
  }

  function imageList(images) {
    var list = document.createElement('div');
    list.className = 'faq-images';
    images.forEach(function (item) {
      // Same rule as the rest of this page: nothing from the API is trusted. An <img> src is the
      // one place feed data reaches the network, so only our own preview path is allowed — never
      // an absolute URL, never data:, never another host.
      if (!item || typeof item.url !== 'string') return;
      if (!/^\/api\/file\/preview\/\d+$/.test(item.url)) return;
      var figure = document.createElement('figure');
      var img = document.createElement('img');
      img.src = String(item.url);
      img.alt = item.caption ? String(item.caption) : '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = function () { figure.hidden = true; };
      figure.appendChild(img);
      if (item.caption) figure.appendChild(el('figcaption', item.caption));
      list.appendChild(figure);
    });
    return list;
  }

  function render(data) {
    var faqs = (data && data.faqs) || [];
    out.textContent = '';

    if (!faqs.length) {
      var empty = el('p', 'No questions have been published yet.');
      empty.className = 'note';
      out.appendChild(empty);
      return;
    }

    var groups = {};
    faqs.forEach(function (f) {
      var key = f.category || 'other';
      (groups[key] = groups[key] || []).push(f);
    });

    var keys = Object.keys(groups).sort(function (a, b) {
      var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });

    // A lone "General" heading labels nothing — it is the only group on the page. Any real
    // categorisation brings the headings straight back.
    var showHeadings = !(keys.length === 1 && keys[0] === 'other');

    keys.forEach(function (key) {
      if (showHeadings) out.appendChild(categoryHeading(key));
      groups[key].forEach(function (f) {
        var d = document.createElement('details');
        d.appendChild(el('summary', f.title || 'Question'));
        var body = el('div', f.body || '');
        body.className = 'answer';
        body.style.whiteSpace = 'pre-line';   // keeps paragraph breaks staff typed
        if (f.images && f.images.length) body.appendChild(imageList(f.images));
        d.appendChild(body);
        out.appendChild(d);
      });
    });
  }

  function normalise(value) {
    return String(value || '').toLocaleLowerCase();
  }

  function groupForKey(key) {
    return propertyGroups.find(function (g) { return String(g.key) === String(key); }) || null;
  }

  function groupText(group) {
    return (group.search_terms || []).join(' ');
  }

  function filteredGroups() {
    var q = normalise(input.value).trim();
    if (!q) return propertyGroups.slice(0, 8);
    return propertyGroups.filter(function (g) {
      return normalise(groupText(g)).indexOf(q) !== -1;
    }).slice(0, 8);
  }

  function setUrlBuilding(key) {
    var u = new URL(window.location.href);
    if (key) u.searchParams.set('building', key);
    else u.searchParams.delete('building');
    history.replaceState(null, '', u);
  }

  function hideMatches() {
    matchesBox.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    activeMatch = -1;
  }

  function renderMatches() {
    var list = filteredGroups();
    matchesBox.textContent = '';
    activeMatch = Math.min(activeMatch, list.length - 1);

    if (!list.length) {
      hideMatches();
      return;
    }

    list.forEach(function (group, index) {
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'match-row';
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', index === activeMatch ? 'true' : 'false');
      row.appendChild(el('span', group.label));
      row.lastChild.className = 'match-label';
      if (group.building_name) {
        row.appendChild(el('span', group.building_name));
        row.lastChild.className = 'match-building';
      }
      row.addEventListener('mousedown', function (e) { e.preventDefault(); });
      row.addEventListener('click', function () { chooseGroup(group); });
      matchesBox.appendChild(row);
    });

    matchesBox.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  }

  function fillSearch(list, currentKey) {
    propertyGroups = Array.isArray(list) ? list : [];
    if (!propertyGroups.length) {
      picker.hidden = true;
      hideMatches();
      return;
    }

    picker.hidden = false;
    var current = currentKey ? groupForKey(currentKey) : null;
    chosenKey = current ? current.key : null;
    input.value = current ? current.label : '';
    clear.hidden = !chosenKey;
    hideMatches();
  }

  var loadSeq = 0;
  function load(propertyIds, afterLoadKey) {
    var mySeq = ++loadSeq;
    var stale = function () { return mySeq !== loadSeq; };
    var url = propertyIds ? API + '?property_id=' + encodeURIComponent(propertyIds) : API;
    fetch(url, { headers: { Accept: 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (json) {
        // A response for a building the visitor has already moved on from must never paint. Two
        // overlapping loads can finish out of order, and the loser would otherwise render its
        // bodies underneath the winner's label.
        if (stale()) return;
        var data = json && json.data;
        render(data);
        fillSearch(data && data.available_property_groups, chosenKey);
        try { sessionStorage.setItem('tane_faq_cache', JSON.stringify(data)); } catch (e) {}
        if (!propertyIds && afterLoadKey) {
          var initial = groupForKey(afterLoadKey);
          if (initial) chooseGroup(initial);
          else setUrlBuilding(null);
        }
      })
      .catch(function () {
        if (stale()) return;
        // Show the last copy this visitor saw rather than an empty page.
        var cached = null;
        try { cached = JSON.parse(sessionStorage.getItem('tane_faq_cache')); } catch (e) {}
        if (cached) {
          render(cached);
          fillSearch(cached.available_property_groups, chosenKey);
          return;
        }
        out.textContent = '';
        var box = el('div', 'We can’t load the questions just now. Please try again shortly, or email mgmt@taneresidence.com.');
        box.className = 'err';
        out.appendChild(box);
      });
  }

  function chooseGroup(group) {
    chosenKey = group.key;
    input.value = group.label;
    clear.hidden = false;
    hideMatches();
    setUrlBuilding(group.key);
    load((group.property_ids || []).join(','));
  }

  function clearBuilding() {
    chosenKey = null;
    input.value = '';
    clear.hidden = true;
    hideMatches();
    setUrlBuilding(null);
    load(null);
  }

  input.addEventListener('input', function () {
    // Typing abandons the current selection. The list MUST go back with it: leaving the previous
    // building's answers on screen under a different building's name in the box is how a tenant
    // ends up following instructions for a flat they do not live in. Only reload on the
    // chosen -> not-chosen transition, so ordinary typing does not refetch on every keystroke.
    var hadSelection = chosenKey !== null;
    chosenKey = null;
    clear.hidden = !input.value;
    setUrlBuilding(null);
    activeMatch = -1;
    renderMatches();
    if (hadSelection) load(null);
  });

  input.addEventListener('focus', function () {
    renderMatches();
  });

  input.addEventListener('blur', function () {
    setTimeout(hideMatches, 120);
  });

  input.addEventListener('keydown', function (e) {
    var list = filteredGroups();
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeMatch = list.length ? (activeMatch + 1) % list.length : -1;
      renderMatches();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeMatch = list.length ? (activeMatch <= 0 ? list.length - 1 : activeMatch - 1) : -1;
      renderMatches();
    } else if (e.key === 'Enter') {
      if (list.length) {
        e.preventDefault();
        chooseGroup(list[Math.max(activeMatch, 0)]);
      }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      clearBuilding();
    }
  });

  clear.addEventListener('click', clearBuilding);

  var initial = new URL(window.location.href).searchParams.get('building');
  load(null, initial || null);
})();
</script>
</body>
</html>
